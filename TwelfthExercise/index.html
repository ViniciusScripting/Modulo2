<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    
    body {
        background-color: black;
    }
    
    div div {
        background-color: #002469;
        width: 400px;
        height: 150px;
        position: relative;
        left: 10px; 

    } 

    .flag {
      text-align: center;
    }
    
    div > div > p {
        background-color: white;
        border-radius: 50%;
        width: 70px;
        height: 70px;
        position: relative;
        left: 160px;
        top: -85px;

    }

    div p {
        color: white;
        background: #DC0024;
        width: 400px;
        height: 50px;
        position: relative;
        left: 10px;
        text-align: center;
        top: 15px;
        
    }

    div > div > div > p {
      color: black;
      text-align: center;
    }
    
    div > div > div {
        background: #DC0024;
        width: 400px;
        height: 50px;
        position: relative;
        left: 0px;
        top: 100px;
    }
  </style>
</head>

<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of <br />Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
